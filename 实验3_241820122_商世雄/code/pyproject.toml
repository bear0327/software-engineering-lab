[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stay-hotel"
version = "1.0.0"
description = "Hotel reservation desktop application"
requires-python = ">=3.11"
dependencies = ["tzdata>=2025.1; platform_system == 'Windows'"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "pylint>=3", "build>=1", "pyinstaller>=6", "pillow>=11"]

[project.scripts]
stay-hotel = "stay.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pylint.main]
py-version = "3.11"

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 10
max-positional-arguments = 10
max-locals = 24
max-attributes = 14
min-public-methods = 0

[tool.pylint.messages_control]
disable = ["missing-function-docstring", "missing-class-docstring", "too-many-lines"]
